bind-key Space run-shell "~/.config/tmux/workspace/tmux-ctdl.sh tracker-editor-toggle '#{pane_id}'"
bind C run-shell "~/.config/tmux/workspace/tmux-ctdl.sh agent-respawn '#{pane_id}'"

# Bar 0 (inner): session name + windows + hostname + per-window agent badge
set -g status-format[0] "#[fg=gray,bg=#333333] #S #[fg=default,bg=default] #(~/.config/tmux/workspace/tmux-ctdl.sh wintab-tick '#{session_name}' 2>/dev/null)#{W:#[fg=brightblack] #I:#W#{@agent_badges} ,#[fg=black,bg=blue,bold] #I:#W#{@agent_badges} #[bg=default]} #[align=right]#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "

# Bar 1 (outer): AI agent status
set -g status-format[1] "#(~/.config/tmux/workspace/tmux-ctdl.sh agentbar #{session_name} #{window_id} 2>/dev/null)"
