name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3 cmake binutils-dev libssl-dev \
            libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev

      # noble dropped the kcov package — build the pinned release instead.
      - name: Build kcov
        run: |
          git clone --branch v43 --depth 1 https://github.com/SimonKagstrom/kcov.git /tmp/kcov-src
          cmake -S /tmp/kcov-src -B /tmp/kcov-build
          cmake --build /tmp/kcov-build -j"$(nproc)"
          sudo cmake --install /tmp/kcov-build

      - name: Run test suite
        run: bash tests/run-tests.sh

      - name: Run coverage
        run: bash tests/run-coverage.sh

      - name: Enforce coverage gate (100% per file)
        run: bash tests/check-coverage.sh 100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .coverage/
          include-hidden-files: true
          retention-days: 14
