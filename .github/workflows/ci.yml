name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov jq sqlite3

      - name: Run test suite
        run: bash tests/run-tests.sh

      - name: Run coverage
        run: bash tests/run-coverage.sh

      - name: Enforce coverage gate (min 90% per file)
        run: bash tests/check-coverage.sh 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage/run-tests.sh.*/
          retention-days: 14
